<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해야 할 일 기록</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="할 일 기록">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>해야 할 일 기록</h1>
  <button class="hbtn" id="settingsBtn">설정</button>
</header>

<div class="warnbox" id="notice" hidden></div>

<main>
  <section id="scr-home">
    <div class="stats" id="stats"></div>

    <div class="add-box">
      <label class="sr" for="newTask">새 할 일 이름</label>
      <input id="newTask" type="text" placeholder="해야 할 일 입력 (예: 운동하기)">
      <button id="addBtn">추가</button>
    </div>

    <div class="undobar" id="undoBar" hidden></div>

    <div class="month-nav">
      <button id="prevBtn" aria-label="지난달">&lt;</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextBtn" aria-label="다음 달">&gt;</button>
    </div>

    <div class="toolbar">
      <button id="viewBtn"></button>
      <button id="hideBtn"></button>
    </div>

    <div class="hnote" id="honestNote"></div>
    <div class="warnbox" id="warnBox" hidden></div>

    <div class="table-wrap" id="tableWrap"></div>
  </section>

  <section id="scr-stats" class="screen" hidden></section>
  <section id="scr-review" class="screen" hidden></section>
  <section id="scr-hist" class="screen" hidden></section>
  <section id="scr-set" class="screen" hidden></section>
</main>

<nav class="tabs" id="tabs" aria-label="화면 이동">
  <button data-tab="home">기록</button>
  <button data-tab="stats">통계</button>
  <button data-tab="review">리뷰</button>
  <button data-tab="hist">내역</button>
  <button data-tab="set">설정</button>
</nav>

<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" hidden></div>

<div class="lock" id="lock" hidden>
  <div class="lock-box">
    <div class="lock-title">LOCKED</div>
    <label class="sr" for="lockInput">비밀번호 4자리</label>
    <input id="lockInput" type="password" inputmode="numeric" maxlength="4" placeholder="----">
    <div id="lockMsg"></div>
    <button id="lockForgot">비밀번호를 잊었어요</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
