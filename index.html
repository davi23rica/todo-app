<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해야 할 일 기록</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="할 일 기록">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  * { box-sizing: border-box; border-radius: 0 !important; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: -apple-system, "Noto Sans KR", sans-serif;
    background: #fff;
    color: #000;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header {
    padding: 18px 16px; background: #000; color: #fff; border-bottom: 4px solid #000;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 3px; }
  .hbtn {
    border: 2px solid #fff; background: #000; color: #fff;
    font-weight: 900; font-size: 13px; padding: 8px 12px; letter-spacing: 1px;
  }

  .stats {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 0; margin: 12px 12px 0; border: 3px solid #000;
  }
  .stat {
    background: #fff; padding: 10px 4px; text-align: center;
    border: 1px solid #000;
  }
  .stat.wide { grid-column: span 2; }
  .stat.black { background: #000; color: #fff; }
  .stat .label { font-size: 12px; color: #555; font-weight: 700; }
  .stat.black .label { color: #ccc; }
  .stat .value { font-size: 24px; font-weight: 900; margin-top: 4px; }
  .stat .sub { font-size: 11px; color: #777; margin-top: 2px; }
  .stat.black .sub { color: #aaa; }

  .add-box { display: flex; gap: 0; padding: 12px; }
  .add-box input {
    flex: 1; padding: 12px; font-size: 16px; font-weight: 700;
    border: 3px solid #000; background: #fff; color: #000; outline: none;
  }
  .add-box button {
    padding: 12px 18px; font-size: 16px; font-weight: 900; border: 3px solid #000;
    background: #000; color: #fff; letter-spacing: 2px;
  }

  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 12px 8px; border: 3px solid #000; background: #fff;
  }
  .month-nav button {
    width: 56px; height: 44px; font-size: 20px; font-weight: 900; border: none;
    background: #000; color: #fff;
  }
  .month-nav button:disabled { background: #ddd; color: #fff; }
  .month-nav .month-label { font-size: 18px; font-weight: 900; letter-spacing: 1px; }

  .hnote { margin: 0 12px 8px; font-size: 12px; font-weight: 900; letter-spacing: 1px; }
  .warnbox {
    margin: 0 12px 8px; background: #000; color: #fff; padding: 10px;
    font-size: 13px; font-weight: 900; line-height: 1.7;
  }

  .table-wrap { overflow-x: auto; margin: 0 12px 16px; background: #fff; border: 3px solid #000; }
  table { border-collapse: collapse; width: max-content; min-width: 100%; }
  th, td { border: 1px solid #000; padding: 10px 6px; text-align: center; white-space: nowrap; }
  th { background: #eee; font-size: 13px; font-weight: 900; min-width: 64px; }
  th.today { background: #000; color: #fff; }
  .name-col {
    position: sticky; left: 0; background: #fff; z-index: 1;
    text-align: left; min-width: 210px; padding-left: 10px;
    border-right: 3px solid #000;
  }
  th.name-col { background: #000; color: #fff; }
  .name-text { font-size: 15px; font-weight: 900; }
  .days-text { font-size: 11px; color: #777; font-weight: 700; margin-top: 2px; }
  .task-rate {
    display: inline-block; margin-top: 4px;
    background: #000; color: #fff;
    font-size: 12px; font-weight: 700;
    padding: 3px 8px;
  }
  .tools { margin-top: 6px; }
  .tools button {
    border: 2px solid #000; background: #fff; color: #000; font-weight: 900;
    padding: 4px 8px; font-size: 12px; margin-right: 3px;
  }
  .tools button:active { background: #000; color: #fff; }
  .tools button:disabled { color: #ccc; border-color: #ccc; }
  .cell {
    width: 48px; height: 44px; font-size: 22px; font-weight: 900;
    border: none; padding: 0;
  }
  .cell.o { background: #000; color: #fff; }
  .cell.x { background: #fff; color: #aaa; }
  .cell.cyc, .cell.sk {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.1; width: 56px; height: 48px;
  }
  .cell .lab {
    display: block; font-size: 10px; font-weight: 900; max-width: 52px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cell.cyc .mk { font-size: 18px; }
  .cell.sk { background: #ddd; color: #000; }
  .cell.sk .mk { font-size: 12px; }
  .none { color: #bbb; background: #f5f5f5; font-size: 12px; font-weight: 700; }
  .empty { padding: 24px; text-align: center; color: #555; font-weight: 700; line-height: 1.6; }

  tr.result td { background: #fff; font-weight: 900; color: #aaa; }
  tr.result td.name-col { background: #fff; color: #000; }
  tr.result td.perfect-cell { background: #000; color: #fff; }
  tr.rate td { background: #eee; font-size: 14px; font-weight: 900; }
  tr.rate td.name-col { background: #eee; }
  tr.memo td { background: #fff; padding: 4px; }
  tr.memo td.name-col { font-weight: 900; }
  .memo-btn {
    display: block; width: 64px; max-width: 64px; height: 36px;
    border: none; background: transparent; color: #000;
    font-size: 12px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .memo-btn.empty-memo { color: #bbb; }
  .perfect { font-size: 11px; font-weight: 900; line-height: 1.3; letter-spacing: 1px; }

  .chart { margin: 0 12px 16px; border: 3px solid #000; padding: 12px; }
  #chart { margin-bottom: 32px; }
  .chart-title { font-weight: 900; font-size: 15px; letter-spacing: 1px; margin-bottom: 10px; }
  .bar-row { display: flex; align-items: center; margin-bottom: 6px; }
  .bar-label { width: 66px; font-size: 12px; font-weight: 900; }
  .bar-track { flex: 1; height: 18px; border: 2px solid #000; background: #fff; }
  .bar-fill { height: 100%; background: #000; }
  .bar-val { width: 48px; text-align: right; font-size: 12px; font-weight: 900; }

  .heat-wrap { display: flex; }
  .heat-days {
    display: grid; grid-template-rows: repeat(7, 14px); gap: 2px;
    margin-right: 4px; font-size: 9px; font-weight: 900; line-height: 14px;
  }
  .heat-scroll { overflow-x: auto; flex: 1; padding-bottom: 4px; }
  .heat-grid {
    display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px);
    grid-auto-columns: 14px; gap: 2px; width: max-content;
  }
  .hc { width: 14px; height: 14px; border: 1px solid #ddd; background: #fff; }
  .legend { display: flex; align-items: center; gap: 3px; margin-top: 8px; font-size: 11px; font-weight: 900; }
  .legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid #ddd; }

  .warn { background: #000; color: #fff; padding: 10px; margin-bottom: 8px; }
  .warn .wl { font-size: 12px; color: #ccc; font-weight: 700; }
  .warn .wv { font-size: 18px; font-weight: 900; margin-top: 2px; }
  .warn .ws { font-size: 12px; color: #aaa; font-weight: 700; margin-top: 2px; }

  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75); z-index: 10;
    display: flex; align-items: flex-start; justify-content: center;
    overflow-y: auto; padding: 16px;
  }
  .panel { background: #fff; border: 4px solid #000; width: 100%; max-width: 480px; padding: 16px; }
  .panel h2 { margin: 0 0 8px; font-size: 18px; font-weight: 900; letter-spacing: 2px; }
  .sec { margin-top: 18px; padding-top: 10px; border-top: 3px solid #000; font-weight: 900; }
  .note { font-size: 12px; color: #555; font-weight: 700; margin: 6px 0; line-height: 1.5; }
  .panel textarea, .panel input[type=text] {
    width: 100%; border: 3px solid #000; padding: 10px; font-size: 14px; font-weight: 700;
    margin-top: 6px; outline: none; font-family: inherit;
  }
  .panel textarea { height: 90px; }
  .btn {
    display: block; width: 100%; padding: 12px; font-size: 15px; font-weight: 900;
    border: 3px solid #000; background: #000; color: #fff; margin-top: 8px;
  }
  .btn.light { background: #fff; color: #000; }
  .row { display: flex; }
  .row .btn { flex: 1; }
  .arc { border: 3px solid #000; padding: 10px; margin-top: 8px; }
  .days { display: flex; margin-top: 6px; }
  .days button {
    flex: 1; padding: 12px 0; border: 2px solid #000; font-weight: 900;
    background: #fff; color: #000; font-size: 14px;
  }
  .days button.on { background: #000; color: #fff; }
  .label-s { font-weight: 900; font-size: 13px; margin-top: 12px; }

  .lock {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .lock-box { width: 85%; max-width: 320px; text-align: center; }
  .lock-title { font-size: 28px; font-weight: 900; letter-spacing: 6px; margin-bottom: 18px; }
  .lock input {
    width: 100%; padding: 14px; font-size: 22px; font-weight: 900; text-align: center;
    border: 3px solid #fff; background: #000; color: #fff; letter-spacing: 8px; outline: none;
  }
  #lockMsg { height: 22px; margin-top: 10px; font-weight: 700; font-size: 14px; }
  #lockForgot {
    margin-top: 18px; border: none; background: none; color: #888;
    font-size: 12px; font-weight: 700; text-decoration: underline;
  }
</style>
</head>
<body>

<header>
  <h1>해야 할 일 기록</h1>
  <button class="hbtn" id="settingsBtn">설정</button>
</header>

<div class="stats" id="stats"></div>

<div class="add-box">
  <input id="newTask" type="text" placeholder="해야 할 일 입력 (예: 운동하기)">
  <button id="addBtn">추가</button>
</div>

<div class="month-nav">
  <button id="prevBtn">&lt;</button>
  <div class="month-label" id="monthLabel"></div>
  <button id="nextBtn">&gt;</button>
</div>

<div class="hnote" id="honestNote"></div>
<div class="warnbox" id="warnBox" hidden></div>

<div class="table-wrap" id="tableWrap"></div>

<div class="chart" id="heat"></div>
<div class="chart" id="weak"></div>
<div class="chart" id="chart"></div>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div>

<div class="lock" id="lock" hidden>
  <div class="lock-box">
    <div class="lock-title">LOCKED</div>
    <input id="lockInput" type="password" inputmode="numeric" maxlength="4" placeholder="----">
    <div id="lockMsg"></div>
    <button id="lockForgot">비밀번호를 잊었어요</button>
  </div>
</div>

<script>
  var KEY = "todo-tracker-v1";
  var DAYNAMES = ["일", "월", "화", "수", "목", "금", "토"];
  var SKIP_LIMIT = 3;
  var schedCache = null;

  function pad(n) { return String(n).padStart(2, "0"); }
  function dateStr(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function todayS() { return dateStr(new Date()); }
  function parseDate(ds) {
    var p = ds.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.tasks && d.records && d.startDate) {
          if (!d.memos) d.memos = {};
          if (d.pin === undefined) d.pin = null;
          if (d.honest === undefined) d.honest = true;
          if (!d.skips) d.skips = {};
          return d;
        }
      }
    } catch (e) {}
    return { startDate: dateStr(new Date()), tasks: [], records: {}, nextId: 1, memos: {}, pin: null, honest: true, skips: {} };
  }

  function save() {
    schedCache = null;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {
      alert("저장에 실패했어요. 브라우저 저장공간을 확인해 주세요.");
    }
  }

  var data = load();
  save();

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist();
  }

  // 오프라인에서도 열리게 하는 기능 (인터넷 주소로 열었을 때만 작동)
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  // 지금 보고 있는 달
  var now0 = new Date();
  var viewYear = now0.getFullYear();
  var viewMonth = now0.getMonth(); // 0 = 1월

  // ---------- 날짜 / 계산 ----------
  function getAllDates() {
    var p = data.startDate.split("-");
    var y = Number(p[0]), m = Number(p[1]) - 1, d = Number(p[2]);
    var today = todayS();
    var list = [];
    for (var i = 0; i < 4000; i++) {
      var s = dateStr(new Date(y, m, d + i));
      list.push(s);
      if (s === today) break;
    }
    return list;
  }

  function getMonthDates(y, m) {
    var last = new Date(y, m + 1, 0).getDate();
    var list = [];
    for (var d = 1; d <= last; d++) {
      list.push(dateStr(new Date(y, m, d)));
    }
    return list;
  }

  function startYM() {
    var p = data.startDate.split("-");
    return Number(p[0]) * 12 + (Number(p[1]) - 1);
  }
  function currentYM() {
    var n = new Date();
    return n.getFullYear() * 12 + n.getMonth();
  }

  // 이번 주 (월요일 ~ 일요일)
  function weekRange() {
    var n = new Date();
    var idx = (n.getDay() + 6) % 7;
    var mon = new Date(n.getFullYear(), n.getMonth(), n.getDate() - idx);
    var sun = new Date(n.getFullYear(), n.getMonth(), n.getDate() - idx + 6);
    return { from: dateStr(mon), to: dateStr(sun) };
  }

  // 정직 모드: 오늘과 어제만 바꿀 수 있어요
  function canEdit(ds) {
    if (!data.honest) return true;
    var n = new Date();
    var today = dateStr(n);
    var yest = dateStr(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1));
    return ds === today || ds === yest;
  }

  function isDone(id, ds) { return !!(data.records[ds] && data.records[ds][id]); }
  function isSkipped(id, ds) { return !!(data.skips[ds] && data.skips[ds][id]); }

  function skipCount(id, ym) {
    var c = 0;
    Object.keys(data.skips).forEach(function (ds) {
      if (ds.indexOf(ym) === 0 && data.skips[ds][id]) c += 1;
    });
    return c;
  }

  // 보관 관련
  function isArchived(t) {
    return !!(t.off && t.off.length && t.off[t.off.length - 1].to === null);
  }
  function archivedOn(t, ds) {
    if (!t.off) return false;
    for (var i = 0; i < t.off.length; i++) {
      var r = t.off[i];
      if (ds >= r.from && (r.to === null || ds < r.to)) return true;
    }
    return false;
  }
  function restoreTask(t) {
    var today = todayS();
    var last = t.off && t.off[t.off.length - 1];
    if (last && last.to === null) {
      if (last.from === today) t.off.pop();
      else last.to = today;
    }
  }

  // 요일 방식
  function taskDays(t) {
    return (t.days && t.days.length) ? t.days : [0, 1, 2, 3, 4, 5, 6];
  }

  // 순환 방식 (A -> B -> C -> 쉼)
  function isCycle(t) {
    return t.mode === "cycle" && t.cycle && t.cycle.names && t.cycle.names.length >= 2;
  }
  function cycleRest(t) {
    var r = Number(t.cycle && t.cycle.rest) || 1;
    return Math.min(3, Math.max(1, r));
  }

  // 시작일부터 오늘까지 순환 일정을 처음부터 계산해요
  function buildCycle(t, today) {
    var res = {};
    var names = t.cycle.names;
    var n = names.length;
    var total = n + cycleRest(t);
    var pos = 0;
    var d = parseDate(t.created);
    for (var i = 0; i < 5000; i++) {
      var ds = dateStr(d);
      if (ds > today) break;
      if (archivedOn(t, ds)) {
        res[ds] = { s: "off" };
      } else if (pos >= n) {
        res[ds] = { s: "rest" };
        pos = (pos + 1) % total;
      } else if (isSkipped(t.id, ds)) {
        res[ds] = { s: "skip", label: names[pos] };
      } else {
        res[ds] = { s: "work", label: names[pos] };
        if (isDone(t.id, ds)) pos = (pos + 1) % total;
      }
      d.setDate(d.getDate() + 1);
    }
    return res;
  }

  // 그 날짜 그 할 일의 상태: before / future / off / rest / skip / work
  function cellState(t, ds) {
    var today = todayS();
    if (ds < t.created) return { s: "before" };
    if (ds > today) return { s: "future" };
    if (isCycle(t)) {
      if (!schedCache || schedCache.day !== today) schedCache = { day: today, map: {} };
      var m = schedCache.map[t.id];
      if (!m) {
        m = buildCycle(t, today);
        schedCache.map[t.id] = m;
      }
      return m[ds] || { s: "before" };
    }
    if (archivedOn(t, ds)) return { s: "off" };
    if (taskDays(t).indexOf(parseDate(ds).getDay()) === -1) return { s: "rest" };
    if (isSkipped(t.id, ds)) return { s: "skip" };
    return { s: "work" };
  }

  function isReq(t, ds) { return cellState(t, ds).s === "work"; }

  function daysLabel(t) {
    if (isCycle(t)) {
      var r = cycleRest(t);
      return "순환 " + t.cycle.names.join(" → ") + " → 쉼" + (r > 1 ? "×" + r : "");
    }
    var d = taskDays(t);
    if (d.length === 7) return "매일";
    return d.map(function (i) { return DAYNAMES[i]; }).join(" ");
  }

  // 그 날 해야 하는 일 / 완료한 일 / 순환의 쉬는 날인지
  function dayInfo(ds) {
    var req = 0, done = 0, cycRest = 0, skipN = 0;
    data.tasks.forEach(function (t) {
      var s = cellState(t, ds).s;
      if (s === "work") {
        req += 1;
        if (isDone(t.id, ds)) done += 1;
      } else if (s === "skip") {
        skipN += 1;
      } else if (s === "rest" && isCycle(t)) {
        cycRest += 1;
      }
    });
    return { req: req, done: done, restDay: (req === 0 && cycRest > 0 && skipN === 0) };
  }

  // PERFECT DAY 인정: 해야 할 일을 전부 했거나, 순환 쉬는 날이라 할 일이 없는 날
  function isPerfect(info) {
    return (info.req > 0 && info.done === info.req) || info.restDay;
  }

  function sumInfo(dates) {
    var req = 0, done = 0, perfect = 0;
    dates.forEach(function (ds) {
      var info = dayInfo(ds);
      req += info.req;
      done += info.done;
      if (isPerfect(info)) perfect += 1;
    });
    return { req: req, done: done, perfect: perfect };
  }

  function taskInfo(t, dates) {
    var req = 0, done = 0;
    dates.forEach(function (ds) {
      if (isReq(t, ds)) {
        req += 1;
        if (isDone(t.id, ds)) done += 1;
      }
    });
    return { req: req, done: done };
  }

  function percent(done, req) {
    if (req === 0) return 0;
    return Math.round(done / req * 100);
  }

  // 연속 PERFECT DAY (오늘이 아직 안 끝났으면 끊기지 않은 걸로 봐요)
  function streakInfo(allDates) {
    var today = todayS();
    var cur = 0, best = 0;
    allDates.forEach(function (ds) {
      var i = dayInfo(ds);
      if (i.req === 0 && !i.restDay) return;
      if (isPerfect(i)) {
        cur += 1;
        if (cur > best) best = cur;
      } else if (ds === today) {
        // 오늘은 아직 기회가 있으니 그대로 둠
      } else {
        cur = 0;
      }
    });
    return { cur: cur, best: best };
  }

  // 어제부터 거꾸로, 연속으로 X였던 날 수 (쉬는 날/스킵/보관은 건너뜀)
  function missStreak(t) {
    var n = new Date();
    var d = new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1);
    var c = 0;
    for (var i = 0; i < 800; i++) {
      var ds = dateStr(d);
      if (ds < t.created) break;
      if (cellState(t, ds).s === "work") {
        if (isDone(t.id, ds)) break;
        c += 1;
      }
      d.setDate(d.getDate() - 1);
    }
    return c;
  }

  // ---------- 화면 그리기 ----------
  function statBox(label, info, wide) {
    return "<div class='stat" + (wide ? " wide" : "") + "'><div class='label'>" + label + "</div>" +
           "<div class='value'>" + percent(info.done, info.req) + "%</div>" +
           "<div class='sub'>" + info.done + " / " + info.req + "</div></div>";
  }

  function renderStats(allDates) {
    var today = todayS();
    var monthPrefix = viewYear + "-" + pad(viewMonth + 1) + "-";
    var yearPrefix = viewYear + "-";
    var wk = weekRange();

    var todayInfo = sumInfo([today]);
    var weekInfo = sumInfo(allDates.filter(function (ds) { return ds >= wk.from && ds <= wk.to; }));
    var monthInfo = sumInfo(allDates.filter(function (ds) { return ds.indexOf(monthPrefix) === 0; }));
    var yearInfo = sumInfo(allDates.filter(function (ds) { return ds.indexOf(yearPrefix) === 0; }));
    var allInfo = sumInfo(allDates);
    var st = streakInfo(allDates);

    document.getElementById("stats").innerHTML =
      statBox("오늘 달성률", todayInfo) +
      statBox("이번 주 달성률", weekInfo) +
      statBox((viewMonth + 1) + "월 달성률", monthInfo) +
      statBox(viewYear + "년 달성률", yearInfo) +
      statBox("지금까지의 달성률", allInfo, true) +
      "<div class='stat black'><div class='label'>PERFECT DAY</div><div class='value'>" + allInfo.perfect + "번</div><div class='sub'>지금까지</div></div>" +
      "<div class='stat black'><div class='label'>연속 PERFECT DAY</div><div class='value'>" + st.cur + "일</div><div class='sub'>최고 " + st.best + "일</div></div>";
  }

  // 2일 이상 연속 X 경고
  function renderWarn() {
    var el = document.getElementById("warnBox");
    var today = todayS();
    var msgs = [];
    data.tasks.forEach(function (t) {
      if (isArchived(t)) return;
      var cs = cellState(t, today);
      if (cs.s === "work" && isDone(t.id, today)) return;
      var m = missStreak(t);
      if (m >= 2) {
        msgs.push("[경고] " + esc(t.name) + " : " + m + "일 연속 X." + (cs.s === "work" ? " 오늘 O로 끊어!" : ""));
      } else if (m === 1 && cs.s === "work") {
        msgs.push("[주의] " + esc(t.name) + " : 어제 X. 오늘도 빼먹으면 2일 연속!");
      }
    });
    el.innerHTML = msgs.join("<br>");
    el.hidden = msgs.length === 0;
  }

  // 흑백 잔디
  function heatColor(pc) {
    if (pc >= 100) return "#000";
    if (pc >= 75) return "#444";
    if (pc >= 50) return "#777";
    if (pc >= 1) return "#a6a6a6";
    return "#d9d9d9";
  }

  function renderHeat(keepScroll) {
    var el = document.getElementById("heat");
    var oldEl = document.getElementById("heatScroll");
    var old = oldEl ? oldEl.scrollLeft : 0;

    var n = new Date();
    var todayS2 = dateStr(n);
    var idx = (n.getDay() + 6) % 7;
    var WEEKS = 20;
    var y = n.getFullYear(), m = n.getMonth();
    var d0 = n.getDate() - idx - 7 * (WEEKS - 1);

    var cells = "";
    for (var w = 0; w < WEEKS; w++) {
      for (var r = 0; r < 7; r++) {
        var dt = new Date(y, m, d0 + w * 7 + r);
        var ds = dateStr(dt);
        var label = (dt.getMonth() + 1) + "/" + dt.getDate();
        var info = dayInfo(ds);
        if (ds > todayS2 || ds < data.startDate || (info.req === 0 && !info.restDay)) {
          cells += "<div class='hc' data-info='" + label + " : 해당 없음'></div>";
        } else {
          var pc = info.restDay ? 100 : percent(info.done, info.req);
          var col = heatColor(pc);
          cells += "<div class='hc' style='background:" + col + ";border-color:" + col + "' data-info='" +
                   label + " : " +
                   (info.restDay ? "쉬는 날 PERFECT DAY" : pc + "% (" + info.done + "/" + info.req + ")" + (pc === 100 ? " PERFECT DAY" : "")) +
                   "'></div>";
        }
      }
    }

    var labels = ["월", "화", "수", "목", "금", "토", "일"].map(function (x) {
      return "<div>" + x + "</div>";
    }).join("");

    el.innerHTML =
      "<div class='chart-title'>활동 잔디 (최근 20주)</div>" +
      "<div class='heat-wrap'><div class='heat-days'>" + labels + "</div>" +
      "<div class='heat-scroll' id='heatScroll'><div class='heat-grid'>" + cells + "</div></div></div>" +
      "<div class='legend'>낮음 " +
      "<i style='background:#d9d9d9;border-color:#d9d9d9'></i>" +
      "<i style='background:#a6a6a6;border-color:#a6a6a6'></i>" +
      "<i style='background:#777;border-color:#777'></i>" +
      "<i style='background:#444;border-color:#444'></i>" +
      "<i style='background:#000;border-color:#000'></i> 높음 &nbsp; " +
      "<i style='background:#fff'></i> 없음</div>" +
      "<div class='note' id='heatInfo'>칸을 누르면 날짜별 달성률이 나와요</div>";

    var sc = document.getElementById("heatScroll");
    sc.scrollLeft = keepScroll ? old : sc.scrollWidth;
  }

  // 약점 분석
  function renderWeak(allDates) {
    var el = document.getElementById("weak");
    var html = "<div class='chart-title'>약점 분석</div>";

    var list = [];
    data.tasks.filter(function (t) { return !isArchived(t); }).forEach(function (t) {
      var ti = taskInfo(t, allDates);
      if (ti.req > 0) list.push({ name: t.name, req: ti.req, done: ti.done, pc: percent(ti.done, ti.req) });
    });

    if (list.length === 0) {
      el.innerHTML = html + "<div class='note'>기록이 쌓이면 약점을 찾아줄게요.</div>";
      return;
    }

    list.sort(function (a, b) {
      return (a.pc - b.pc) || ((b.req - b.done) - (a.req - a.done));
    });
    var w = list[0];
    if (w.pc === 100) {
      html += "<div class='warn'><div class='wl'>가장 약한 할 일</div><div class='wv'>약점 없음</div><div class='ws'>모든 할 일이 100%예요</div></div>";
    } else {
      html += "<div class='warn'><div class='wl'>가장 자주 빼먹는 할 일</div><div class='wv'>" + esc(w.name) +
              "</div><div class='ws'>달성률 " + w.pc + "% / 빼먹은 횟수 " + (w.req - w.done) + "번</div></div>";
    }

    var order = [1, 2, 3, 4, 5, 6, 0];
    var rows = order.map(function (d) {
      var ds = allDates.filter(function (x) { return parseDate(x).getDay() === d; });
      var i = sumInfo(ds);
      return { d: d, req: i.req, done: i.done, pc: percent(i.done, i.req) };
    });
    var cands = rows.filter(function (r) { return r.req > 0; });
    cands.sort(function (a, b) { return (a.pc - b.pc) || (b.req - a.req); });
    var wd = cands.length ? cands[0] : null;

    if (wd) {
      if (wd.pc === 100) {
        html += "<div class='warn'><div class='wl'>가장 약한 요일</div><div class='wv'>약점 없음</div><div class='ws'>모든 요일이 100%예요</div></div>";
      } else {
        html += "<div class='warn'><div class='wl'>가장 약한 요일</div><div class='wv'>" + DAYNAMES[wd.d] +
                "요일</div><div class='ws'>달성률 " + wd.pc + "% (" + wd.done + "/" + wd.req + ")</div></div>";
      }
    }

    html += "<div class='label-s' style='margin-top:12px'>요일별 달성률</div>";
    rows.forEach(function (r) {
      var weak = wd && wd.pc < 100 && r.d === wd.d;
      html += "<div class='bar-row'><div class='bar-label'>" + DAYNAMES[r.d] + "요일" + (weak ? " !" : "") + "</div>" +
              "<div class='bar-track'><div class='bar-fill' style='width:" + (r.req > 0 ? r.pc : 0) + "%'></div></div>" +
              "<div class='bar-val'>" + (r.req > 0 ? r.pc + "%" : "-") + "</div></div>";
    });

    el.innerHTML = html;
  }

  function renderChart(allDates) {
    var months = {}, order = [];
    allDates.forEach(function (ds) {
      var k = ds.slice(0, 7);
      if (!months[k]) { months[k] = []; order.push(k); }
      months[k].push(ds);
    });
    var keys = order.slice(-12);
    var html = "<div class='chart-title'>월별 달성률</div>";
    keys.forEach(function (k) {
      var i = sumInfo(months[k]);
      var pc = percent(i.done, i.req);
      html += "<div class='bar-row'><div class='bar-label'>" + k.replace("-", ".") + "</div>" +
              "<div class='bar-track'><div class='bar-fill' style='width:" + pc + "%'></div></div>" +
              "<div class='bar-val'>" + pc + "%</div></div>";
    });
    document.getElementById("chart").innerHTML = html;
  }

  function renderMonthNav() {
    document.getElementById("monthLabel").textContent = viewYear + "년 " + (viewMonth + 1) + "월";
    var vym = viewYear * 12 + viewMonth;
    document.getElementById("prevBtn").disabled = vym <= startYM();
    document.getElementById("nextBtn").disabled = vym >= currentYM();
  }

  function changeMonth(diff) {
    var d = new Date(viewYear, viewMonth + diff, 1);
    var ym = d.getFullYear() * 12 + d.getMonth();
    if (ym < startYM() || ym > currentYM()) return;
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
    render(false);
  }

  function render(keepScroll) {
    schedCache = null;
    var wrap = document.getElementById("tableWrap");
    var oldScroll = wrap.scrollLeft;
    var allDates = getAllDates();
    var dates = getMonthDates(viewYear, viewMonth);
    var today = todayS();
    var active = data.tasks.filter(function (t) { return !isArchived(t); });

    renderStats(allDates);
    renderHeat(keepScroll);
    renderWeak(allDates);
    renderChart(allDates);
    renderMonthNav();
    renderWarn();
    document.getElementById("honestNote").textContent =
      data.honest ? "정직 모드 ON : 오늘과 어제만 체크할 수 있어요" : "";

    if (active.length === 0) {
      if (data.tasks.length > 0) {
        wrap.innerHTML = '<div class="empty">보관되지 않은 할 일이 없어요.<br>위에서 추가하거나 설정의 보관함을 확인해 보세요.</div>';
      } else {
        wrap.innerHTML = '<div class="empty">아직 해야 할 일이 없어요.<br>위에서 추가해 보세요!</div>';
      }
      return;
    }

    var html = "<table><thead><tr><th class='name-col'>해야 할 일</th>";
    dates.forEach(function (ds) {
      var p = ds.split("-");
      var label = Number(p[1]) + "/" + Number(p[2]);
      html += "<th class='" + (ds === today ? "today" : "") + "'>" + label + "</th>";
    });
    html += "</tr></thead><tbody>";

    active.forEach(function (t, idx) {
      var ti = taskInfo(t, allDates);

      html += "<tr><td class='name-col'>";
      html += "<div class='name-text'>" + esc(t.name) + "</div>";
      html += "<div class='days-text'>" + esc(daysLabel(t)) + "</div>";
      if (isCycle(t)) {
        var tcs = cellState(t, today);
        var tl = tcs.s === "work" ? tcs.label : (tcs.s === "rest" ? "쉼" : (tcs.s === "skip" ? "스킵" : "-"));
        var tdone = (tcs.s === "work" && isDone(t.id, today)) ? " (완료)" : "";
        html += "<div class='days-text'>오늘 차례 : " + esc(tl) + tdone + "</div>";
      }
      html += "<div class='task-rate'>달성률 " + percent(ti.done, ti.req) + "% (" + ti.done + "/" + ti.req + ")</div>";
      html += "<div class='tools'>";
      html += "<button data-act='edit' data-id='" + t.id + "'>수정</button>";
      html += "<button data-act='arc' data-id='" + t.id + "'>보관</button>";
      html += "<button data-act='skip' data-id='" + t.id + "'>스킵</button>";
      html += "<button data-act='up' data-id='" + t.id + "'" + (idx === 0 ? " disabled" : "") + ">▲</button>";
      html += "<button data-act='down' data-id='" + t.id + "'" + (idx === active.length - 1 ? " disabled" : "") + ">▼</button>";
      html += "</div></td>";

      dates.forEach(function (ds) {
        if (ds > today) {
          html += "<td class='none'>·</td>";
          return;
        }
        var cs = cellState(t, ds);
        if (cs.s === "before") {
          html += "<td class='none'>-</td>";
        } else if (cs.s === "rest") {
          html += "<td class='none'>쉼</td>";
        } else if (cs.s === "off") {
          html += "<td class='none'>보관</td>";
        } else if (cs.s === "skip") {
          var sa = canEdit(ds) ? "unskip" : "locked";
          html += "<td><button class='cell sk' data-act='" + sa + "' data-id='" + t.id + "' data-date='" + ds + "'>" +
                  (cs.label ? "<span class='lab'>" + esc(cs.label) + "</span>" : "") +
                  "<span class='mk'>스킵</span></button></td>";
        } else {
          var done = isDone(t.id, ds);
          var act = canEdit(ds) ? "toggle" : "locked";
          var cyc = !!cs.label;
          html += "<td><button class='cell " + (done ? "o" : "x") + (cyc ? " cyc" : "") + "' data-act='" + act +
                  "' data-id='" + t.id + "' data-date='" + ds + "'>" +
                  (cyc ? "<span class='lab'>" + esc(cs.label) + "</span>" : "") +
                  "<span class='mk'>" + (done ? "O" : "X") + "</span></button></td>";
        }
      });
      html += "</tr>";
    });

    // 결과 줄 (PERFECT DAY)
    html += "<tr class='result'><td class='name-col'>결과</td>";
    dates.forEach(function (ds) {
      var info = dayInfo(ds);
      if (ds > today || (info.req === 0 && !info.restDay)) {
        html += "<td class='none'>-</td>";
      } else if (isPerfect(info)) {
        html += "<td class='perfect-cell'><div class='perfect'>PERFECT<br>DAY" + (info.restDay ? "<br>(쉼)" : "") + "</div></td>";
      } else {
        html += "<td>X</td>";
      }
    });
    html += "</tr>";

    // 날짜별 달성률 줄
    html += "<tr class='rate'><td class='name-col'>날짜별 달성률</td>";
    dates.forEach(function (ds) {
      var info = dayInfo(ds);
      if (ds > today || info.req === 0) {
        html += "<td class='none'>-</td>";
      } else {
        html += "<td>" + percent(info.done, info.req) + "%</td>";
      }
    });
    html += "</tr>";

    // 한 줄 메모 줄
    html += "<tr class='memo'><td class='name-col'>한 줄 메모</td>";
    dates.forEach(function (ds) {
      if (ds > today) {
        html += "<td class='none'>·</td>";
      } else {
        var m = data.memos[ds];
        if (m) {
          html += "<td><button class='memo-btn' data-act='memo' data-date='" + ds + "'>" + esc(m) + "</button></td>";
        } else {
          html += "<td><button class='memo-btn empty-memo' data-act='memo' data-date='" + ds + "'>+</button></td>";
        }
      }
    });
    html += "</tr>";

    html += "</tbody></table>";
    wrap.innerHTML = html;

    if (keepScroll) {
      wrap.scrollLeft = oldScroll;
    } else {
      var todayTh = wrap.querySelector("th.today");
      wrap.scrollLeft = todayTh ? Math.max(0, todayTh.offsetLeft - 230) : 0;
    }
  }

  // ---------- 할 일 추가 / 삭제 ----------
  function addTask() {
    var input = document.getElementById("newTask");
    var name = input.value.trim();
    if (!name) return;
    data.tasks.push({
      id: data.nextId, name: name, created: todayS(),
      mode: "days", days: [0, 1, 2, 3, 4, 5, 6], off: []
    });
    data.nextId += 1;
    save();
    input.value = "";
    render(true);
  }

  function deleteTask(id) {
    var t = data.tasks.find(function (x) { return x.id === id; });
    if (!t) return false;
    if (!confirm("'" + t.name + "' 을(를) 완전히 삭제할까요?\n이 일의 기록도 함께 사라져요.\n(기록을 남기고 싶으면 '보관'을 쓰세요)")) return false;
    data.tasks = data.tasks.filter(function (x) { return x.id !== id; });
    Object.keys(data.records).forEach(function (d) {
      delete data.records[d][id];
    });
    Object.keys(data.skips).forEach(function (d) {
      delete data.skips[d][id];
    });
    save();
    return true;
  }

  // ---------- 팝업 창 ----------
  function openPanel(html) {
    document.getElementById("panel").innerHTML = html;
    document.getElementById("overlay").hidden = false;
  }
  function closePanel() {
    document.getElementById("overlay").hidden = true;
    document.getElementById("panel").innerHTML = "";
  }

  // 할 일 수정 (이름 + 방식(요일/순환) + 삭제)
  function openEdit(id) {
    var t = data.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    var mode = isCycle(t) ? "cycle" : "days";
    var sel = taskDays(t).slice();
    var rest = isCycle(t) ? cycleRest(t) : 1;
    var namesVal = isCycle(t) ? t.cycle.names.join(", ") : "A, B, C";

    var dayHtml = "";
    for (var i = 0; i < 7; i++) {
      dayHtml += "<button data-d='" + i + "' class='" + (sel.indexOf(i) !== -1 ? "on" : "") + "'>" + DAYNAMES[i] + "</button>";
    }
    var restHtml = "";
    for (var r = 1; r <= 3; r++) {
      restHtml += "<button data-r='" + r + "' class='" + (r === rest ? "on" : "") + "'>" + r + "일</button>";
    }

    openPanel(
      "<h2>할 일 수정</h2>" +
      "<div class='label-s'>이름</div>" +
      "<input type='text' id='editName' value=\"" + esc(t.name) + "\">" +
      "<div class='label-s'>방식</div>" +
      "<div class='days' id='modeBtns'>" +
        "<button data-m='days'>매일 / 요일 지정</button>" +
        "<button data-m='cycle'>순환 (A→B→C→쉼)</button>" +
      "</div>" +
      "<div id='daysBox'>" +
        "<div class='label-s'>해야 하는 요일 (눌러서 켜고 끄기)</div>" +
        "<div class='days' id='dayBtns'>" + dayHtml + "</div>" +
      "</div>" +
      "<div id='cycleBox'>" +
        "<div class='label-s'>순환 이름 (쉼표로 구분, 2~6개)</div>" +
        "<input type='text' id='cycNames' value=\"" + esc(namesVal) + "\">" +
        "<div class='note'>예: A, B, C 또는 가슴, 등, 하체. 못 한 날은 같은 차례가 다음 날로 넘어가요.</div>" +
        "<div class='label-s'>순환이 끝난 뒤 쉬는 날</div>" +
        "<div class='days' id='restBtns'>" + restHtml + "</div>" +
      "</div>" +
      "<div class='note'>방식을 바꾸면 지난 날짜의 계산도 새 방식으로 다시 계산돼요. O/X 기록은 그대로 남아요.</div>" +
      "<button class='btn' id='editSave'>저장</button>" +
      "<button class='btn light' id='editCancel'>취소</button>" +
      "<div class='sec'>삭제</div>" +
      "<div class='note'>기록을 남기고 싶으면 삭제 말고 표의 '보관'을 쓰세요.</div>" +
      "<button class='btn light' id='editDel'>이 할 일 완전히 삭제</button>"
    );

    function showMode() {
      document.getElementById("daysBox").hidden = (mode !== "days");
      document.getElementById("cycleBox").hidden = (mode !== "cycle");
      var mb = document.querySelectorAll("#modeBtns button");
      for (var k = 0; k < mb.length; k++) {
        mb[k].className = (mb[k].getAttribute("data-m") === mode) ? "on" : "";
      }
    }
    showMode();

    document.getElementById("modeBtns").addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      mode = b.getAttribute("data-m");
      showMode();
    });
    document.getElementById("dayBtns").addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      var d = Number(b.getAttribute("data-d"));
      var pos = sel.indexOf(d);
      if (pos === -1) { sel.push(d); b.className = "on"; }
      else { sel.splice(pos, 1); b.className = ""; }
    });
    document.getElementById("restBtns").addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      rest = Number(b.getAttribute("data-r"));
      var all = document.querySelectorAll("#restBtns button");
      for (var k = 0; k < all.length; k++) {
        all[k].className = (Number(all[k].getAttribute("data-r")) === rest) ? "on" : "";
      }
    });
    document.getElementById("editCancel").addEventListener("click", closePanel);
    document.getElementById("editSave").addEventListener("click", function () {
      var name = document.getElementById("editName").value.trim();
      if (!name) { alert("이름을 입력해 주세요."); return; }
      if (mode === "days") {
        if (sel.length === 0) { alert("요일을 하나 이상 선택해 주세요."); return; }
        t.mode = "days";
        t.days = sel.slice().sort(function (a, b) { return a - b; });
      } else {
        var arr = document.getElementById("cycNames").value.split(/[,，\n]/)
          .map(function (s) { return s.trim().slice(0, 8); })
          .filter(function (s) { return s; });
        if (arr.length < 2 || arr.length > 6) {
          alert("순환 이름은 2개~6개로 입력해 주세요. (예: A, B, C)");
          return;
        }
        t.mode = "cycle";
        t.cycle = { names: arr, rest: rest };
      }
      t.name = name;
      save();
      closePanel();
      render(true);
    });
    document.getElementById("editDel").addEventListener("click", function () {
      if (deleteTask(id)) {
        closePanel();
        render(true);
      }
    });
  }

  // 스킵 창 (한 달에 3번까지, 달성률과 연속 기록에서 빠져요)
  function openSkip(id) {
    var t = data.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    var n = new Date();
    var back = data.honest ? 1 : 7;
    var rows = "";
    for (var i = 0; i <= back; i++) {
      var dt = new Date(n.getFullYear(), n.getMonth(), n.getDate() - i);
      var ds = dateStr(dt);
      var label = (dt.getMonth() + 1) + "/" + dt.getDate() + " (" + DAYNAMES[dt.getDay()] + ")" +
                  (i === 0 ? " 오늘" : (i === 1 ? " 어제" : ""));
      var cs = cellState(t, ds);
      var cnt = skipCount(id, ds.slice(0, 7));
      var info = "", btn = "";
      if (cs.s === "before") {
        info = "시작 전";
      } else if (cs.s === "skip") {
        info = "스킵함";
        btn = "<button class='btn light' data-sk='un' data-date='" + ds + "'>스킵 취소</button>";
      } else if (cs.s === "work") {
        if (isDone(id, ds)) {
          info = "O 완료 (스킵 불가)";
        } else {
          info = "X (아직 안 함)";
          btn = "<button class='btn' data-sk='do' data-date='" + ds + "'>이 날 스킵</button>";
        }
      } else if (cs.s === "rest") {
        info = "쉬는 날 (스킵 필요 없음)";
      } else {
        info = "보관 중";
      }
      rows += "<div class='arc'><div class='name-text'>" + label + "</div>" +
              "<div class='note'>" + info + " / " + Number(ds.slice(5, 7)) + "월 스킵 " + cnt + "/" + SKIP_LIMIT + "</div>" + btn + "</div>";
    }

    openPanel(
      "<h2>스킵 : " + esc(t.name) + "</h2>" +
      "<div class='note'>아프거나 사정이 있는 날만 쓰세요. 한 달에 " + SKIP_LIMIT + "번까지만 돼요. 스킵한 날은 달성률에서 빠지고 연속 기록도 안 끊겨요." +
      (data.honest ? " 정직 모드라서 오늘과 어제만 스킵할 수 있어요." : "") + "</div>" +
      "<div id='skList'>" + rows + "</div>" +
      "<button class='btn light' id='skClose' style='margin-top:18px'>닫기</button>"
    );

    document.getElementById("skList").addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      var act = b.getAttribute("data-sk");
      var d = b.getAttribute("data-date");
      if (!canEdit(d)) { alert("정직 모드: 오늘과 어제만 바꿀 수 있어요."); return; }

      if (act === "do") {
        var c = cellState(t, d);
        if (c.s !== "work" || isDone(id, d)) return;
        if (skipCount(id, d.slice(0, 7)) >= SKIP_LIMIT) {
          alert("그 달의 스킵을 다 썼어요. (" + SKIP_LIMIT + "번)");
          return;
        }
        if (!data.skips[d]) data.skips[d] = {};
        data.skips[d][id] = true;
      } else if (act === "un") {
        if (data.skips[d]) {
          delete data.skips[d][id];
          if (Object.keys(data.skips[d]).length === 0) delete data.skips[d];
        }
      }
      save();
      render(true);
      openSkip(id);
    });
    document.getElementById("skClose").addEventListener("click", closePanel);
  }

  // ---------- 백업 / 복원 ----------
  function restoreFrom(text) {
    var d;
    try { d = JSON.parse(text); } catch (e) {
      alert("백업 내용이 올바르지 않아요."); return;
    }
    if (!d || !Array.isArray(d.tasks) || !d.records || typeof d.startDate !== "string") {
      alert("백업 내용이 올바르지 않아요."); return;
    }
    if (!confirm("지금 기록이 백업 기록으로 바뀌어요. 계속할까요?")) return;
    try { localStorage.setItem(KEY + "-prev", JSON.stringify(data)); } catch (e) {}
    if (!d.memos) d.memos = {};
    if (d.pin === undefined) d.pin = null;
    if (d.honest === undefined) d.honest = true;
    if (!d.skips) d.skips = {};
    var mx = 0;
    d.tasks.forEach(function (t) { if (t.id > mx) mx = t.id; });
    d.nextId = Math.max(d.nextId || 1, mx + 1);
    data = d;
    save();
    var n = new Date();
    viewYear = n.getFullYear();
    viewMonth = n.getMonth();
    closePanel();
    render(false);
    alert("복원이 끝났어요!");
  }

  function hashPin(s) {
    var h = 7;
    for (var i = 0; i < s.length; i++) {
      h = (h * 31 + s.charCodeAt(i)) % 1000000007;
    }
    return "p" + h;
  }

  function openSettings() {
    var allDates = getAllDates();
    var arcHtml = "";
    data.tasks.filter(isArchived).forEach(function (t) {
      var ti = taskInfo(t, allDates);
      arcHtml += "<div class='arc'><div class='name-text'>" + esc(t.name) + "</div>" +
        "<div class='note'>보관 전 달성률 " + percent(ti.done, ti.req) + "% (" + ti.done + "/" + ti.req + ")</div>" +
        "<div class='row'><button class='btn light' data-arc='restore' data-id='" + t.id + "'>되살리기</button>" +
        "<button class='btn light' data-arc='del' data-id='" + t.id + "'>영구 삭제</button></div></div>";
    });
    if (!arcHtml) arcHtml = "<div class='note'>보관한 할 일이 없어요.</div>";

    openPanel(
      "<h2>설정</h2>" +
      "<div class='sec'>정직 모드</div>" +
      "<div class='note'>켜면 오늘과 어제 칸만 바꿀 수 있어요. 며칠 뒤에 몰아서 O로 바꾸는 걸 막아줘요.</div>" +
      "<button class='btn' id='honestBtn'>정직 모드 : " + (data.honest ? "켜짐 (누르면 끔)" : "꺼짐 (누르면 켬)") + "</button>" +
      "<div class='sec'>보관함</div>" +
      "<div class='note'>보관한 일은 표에서 숨겨지고, 보관한 날부터 달성률에 안 들어가요. 지난 기록은 그대로 남아요.</div>" +
      "<div id='arcList'>" + arcHtml + "</div>" +
      "<div class='sec'>기록 백업 / 복원</div>" +
      "<div class='note'>백업을 해두면 폰을 바꾸거나 앱을 지워도 기록을 살릴 수 있어요. 가끔 백업해서 메모장이나 카톡 나에게 보내기에 보관해 두세요.</div>" +
      "<textarea id='bk' placeholder='여기에 백업 글이 나오거나, 복원할 글을 붙여넣어요'></textarea>" +
      "<button class='btn' id='bkCopy'>백업 복사하기</button>" +
      "<button class='btn' id='bkFile'>백업 파일로 저장</button>" +
      "<button class='btn light' id='bkRestoreText'>위 칸에 붙여넣은 글로 복원</button>" +
      "<button class='btn light' id='bkRestoreFile'>백업 파일에서 복원</button>" +
      "<input type='file' id='bkInput' accept='.json,application/json' hidden>" +
      "<div class='sec'>잠금</div>" +
      "<div class='note'>가볍게 남이 못 열게 하는 잠금이에요. 숫자 4자리를 써요.</div>" +
      "<button class='btn' id='pinSet'>" + (data.pin ? "비밀번호 변경" : "비밀번호 설정") + "</button>" +
      (data.pin ? "<button class='btn light' id='pinOff'>비밀번호 끄기</button>" : "") +
      "<button class='btn light' id='panelClose' style='margin-top:18px'>닫기</button>"
    );

    // 정직 모드 켜기 / 끄기
    document.getElementById("honestBtn").addEventListener("click", function () {
      if (data.honest) {
        if (!confirm("정말 끌까요?\n상남자는 정직해야 해요.")) return;
        data.honest = false;
      } else {
        data.honest = true;
      }
      save();
      render(true);
      openSettings();
    });

    // 보관함 (되살리기 / 영구 삭제)
    document.getElementById("arcList").addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      var id = Number(b.getAttribute("data-id"));
      var t = data.tasks.find(function (x) { return x.id === id; });
      if (!t) return;
      if (b.getAttribute("data-arc") === "restore") {
        restoreTask(t);
        save();
        render(true);
        openSettings();
      } else if (b.getAttribute("data-arc") === "del") {
        if (deleteTask(id)) {
          render(true);
          openSettings();
        }
      }
    });

    var ta = document.getElementById("bk");

    document.getElementById("bkCopy").addEventListener("click", function () {
      ta.value = JSON.stringify(data);
      ta.focus();
      ta.select();
      var ok = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ta.value);
          ok = true;
        } else {
          ok = document.execCommand("copy");
        }
      } catch (e) {}
      alert(ok ? "복사됐어요! 메모장 같은 곳에 붙여넣어 보관하세요." : "위 칸의 글을 직접 길게 눌러서 전체 복사해 주세요.");
    });

    document.getElementById("bkFile").addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(data)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "todo-backup-" + todayS() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    });

    document.getElementById("bkRestoreText").addEventListener("click", function () {
      if (!ta.value.trim()) { alert("위 칸에 백업 글을 붙여넣어 주세요."); return; }
      restoreFrom(ta.value);
    });

    var fileInput = document.getElementById("bkInput");
    document.getElementById("bkRestoreFile").addEventListener("click", function () { fileInput.click(); });
    fileInput.addEventListener("change", function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () { restoreFrom(String(r.result)); };
      r.readAsText(f);
    });

    document.getElementById("pinSet").addEventListener("click", function () {
      if (data.pin) {
        var cur = prompt("지금 비밀번호를 입력하세요");
        if (cur === null) return;
        if (hashPin(cur) !== data.pin) { alert("비밀번호가 틀렸어요."); return; }
      }
      var p = prompt("새 비밀번호 (숫자 4자리)");
      if (p === null) return;
      if (!/^\d{4}$/.test(p)) { alert("숫자 4자리로 입력해 주세요."); return; }
      data.pin = hashPin(p);
      save();
      alert("비밀번호가 설정됐어요. 잊어버리지 마세요!");
      openSettings();
    });

    var off = document.getElementById("pinOff");
    if (off) {
      off.addEventListener("click", function () {
        var cur = prompt("지금 비밀번호를 입력하세요");
        if (cur === null) return;
        if (hashPin(cur) !== data.pin) { alert("비밀번호가 틀렸어요."); return; }
        data.pin = null;
        save();
        openSettings();
      });
    }

    document.getElementById("panelClose").addEventListener("click", closePanel);
  }

  // ---------- 잠금 화면 ----------
  function showLock() {
    if (!data.pin) return;
    document.getElementById("lock").hidden = false;
    document.getElementById("lockInput").value = "";
    document.getElementById("lockMsg").textContent = "";
  }

  document.getElementById("lockInput").addEventListener("input", function () {
    var inp = document.getElementById("lockInput");
    if (inp.value.length < 4) return;
    if (hashPin(inp.value) === data.pin) {
      document.getElementById("lock").hidden = true;
      inp.value = "";
      document.getElementById("lockMsg").textContent = "";
    } else {
      document.getElementById("lockMsg").textContent = "비밀번호가 틀렸어요";
      inp.value = "";
    }
  });

  document.getElementById("lockForgot").addEventListener("click", function () {
    if (confirm("잠금을 끌까요?\n기록은 지워지지 않아요. 비밀번호만 없어져요.")) {
      data.pin = null;
      save();
      document.getElementById("lock").hidden = true;
    }
  });

  // ---------- 버튼 연결 ----------
  document.getElementById("addBtn").addEventListener("click", addTask);
  document.getElementById("newTask").addEventListener("keydown", function (e) {
    if (e.key === "Enter") addTask();
  });
  document.getElementById("settingsBtn").addEventListener("click", openSettings);
  document.getElementById("prevBtn").addEventListener("click", function () { changeMonth(-1); });
  document.getElementById("nextBtn").addEventListener("click", function () { changeMonth(1); });

  // 잔디 칸을 누르면 날짜별 달성률 보여주기
  document.getElementById("heat").addEventListener("click", function (e) {
    var c = e.target.closest(".hc");
    if (!c) return;
    document.getElementById("heatInfo").textContent = c.getAttribute("data-info");
  });

  document.getElementById("tableWrap").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn || btn.disabled) return;
    var act = btn.getAttribute("data-act");
    var id = Number(btn.getAttribute("data-id"));

    if (act === "locked") {
      alert("정직 모드: 오늘과 어제만 바꿀 수 있어요.");
      return;
    }

    if (act === "toggle") {
      var ds = btn.getAttribute("data-date");
      if (!canEdit(ds)) {
        alert("정직 모드: 오늘과 어제만 바꿀 수 있어요.");
        return;
      }
      if (!data.records[ds]) data.records[ds] = {};
      if (data.records[ds][id]) {
        delete data.records[ds][id];
      } else {
        data.records[ds][id] = true;
      }
      save();
      render(true);
    }

    if (act === "unskip") {
      var sd = btn.getAttribute("data-date");
      if (!canEdit(sd)) {
        alert("정직 모드: 오늘과 어제만 바꿀 수 있어요.");
        return;
      }
      if (confirm("이 날의 스킵을 취소할까요?")) {
        if (data.skips[sd]) {
          delete data.skips[sd][id];
          if (Object.keys(data.skips[sd]).length === 0) delete data.skips[sd];
        }
        save();
        render(true);
      }
    }

    if (act === "skip") {
      openSkip(id);
    }

    if (act === "edit") {
      openEdit(id);
    }

    if (act === "arc") {
      var ta = data.tasks.find(function (t) { return t.id === id; });
      if (!ta) return;
      if (confirm("'" + ta.name + "' 을(를) 보관할까요?\n오늘부터 달성률에 안 들어가요. 지난 기록은 그대로 남고, 설정의 보관함에서 되살릴 수 있어요.")) {
        if (!ta.off) ta.off = [];
        ta.off.push({ from: todayS(), to: null });
        save();
        render(true);
      }
    }

    if (act === "up" || act === "down") {
      var active = data.tasks.filter(function (t) { return !isArchived(t); });
      var ai = active.findIndex(function (t) { return t.id === id; });
      var aj = act === "up" ? ai - 1 : ai + 1;
      if (ai < 0 || aj < 0 || aj >= active.length) return;
      var i = data.tasks.indexOf(active[ai]);
      var j = data.tasks.indexOf(active[aj]);
      var tmp = data.tasks[i];
      data.tasks[i] = data.tasks[j];
      data.tasks[j] = tmp;
      save();
      render(true);
    }

    if (act === "memo") {
      var md = btn.getAttribute("data-date");
      var cur = data.memos[md] || "";
      var m = prompt(md.slice(5).replace("-", "/") + " 한 줄 메모 (지우려면 비워두기)", cur);
      if (m === null) return;
      m = m.trim();
      if (m) data.memos[md] = m;
      else delete data.memos[md];
      save();
      render(true);
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      showLock();
    } else {
      render(true);
    }
  });

  render(false);
  showLock();
</script>
</body>
</html>
